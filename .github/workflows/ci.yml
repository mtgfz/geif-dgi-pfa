name: CI

on:
  push:
    branches: [main, local-snapshot]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Tesseract (pour les tests OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
      - name: Dépendances
        run: pip install -r backend/requirements-test.txt
      - name: Tests (base MongoDB simulée, aucun appel réseau)
        run: cd backend && python -m pytest tests -q

  frontend:
    name: Frontend (contrôles statiques)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pages, imports, menu, ordre d'initialisation, syntaxe
        run: python3 scripts/check_frontend.py

  docker:
    name: Docker (fichiers de configuration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet
      - name: Construire l'interface web (nginx)
        run: docker build -t geif-web ./frontend

  pipeline-ml:
    name: Piliers ML (données synthétiques)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate synthetic test data
        run: |
          cd data/generators
          python generate_documents.py --n 20 --out ../processed/synthetic_dataset
      - name: Build OCR training corpus
        run: |
          cd data/generators
          python build_training_corpus.py --dataset ../processed/synthetic_dataset --out ../processed/training_corpus.json
      - name: Train classifier
        run: |
          cd ml_classification
          python classifier.py train --corpus ../data/processed/training_corpus.json --model ./model.joblib
